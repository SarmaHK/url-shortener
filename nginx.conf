server {
    listen 80;
    
    # Accept requests from any domain name or IP
    server_name _;

    # 1. Try to serve static files from the public folder first
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # If the file exists, serve it. If not, fallback to the @backend block
        try_files $uri $uri/ @backend;
    }

    # 2. Proxy everything else (API requests and shortlink redirects) to the Node app
    location @backend {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
